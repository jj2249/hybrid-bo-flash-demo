[project]
dependencies = [
    "hybrid-bo @ git+https://github.com/jj2249/hybrid-bo.git@v0.3.0",
]
name = "flash-hybrid-bo"
description = "Flash vessel demo for hybrid-bo"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.15"
matplotlib = ">=3.11.2,<4"
scipy = ">=1.18.1,<2"

[tool.pixi.pypi-dependencies]
flash_hybrid_bo = { path = ".", editable = true }

[tool.pixi.tasks]
# The poster's regret plot and cost table, as a new run
regret = "python studies/flash_regret.py rerun --seeds 20 --iterations 15"
table = "python studies/flash_table.py rerun"
